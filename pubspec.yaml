name: verdia
description: "VERDIA — Partage ton action. Inspire. Agis."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.9.0
  http: ^1.6.0

  # Env config
  flutter_dotenv: ^5.2.1

  # Internationalisation (architecture prête, seul le français est peuplé
  # pour l'instant — voir lib/l10n/app_fr.arb)
  flutter_localizations:
    sdk: flutter

  # UI / assets
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Media
  image_picker: ^1.1.2
  uuid: ^4.5.1
  share_plus: ^10.1.4

  # Localization
  intl: ^0.20.2

  # Carte
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
